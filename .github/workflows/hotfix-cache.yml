name: 应用小修复

on:
  push:
    paths:
      - ".github/workflows/hotfix-cache.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 打补丁
        run: python .github/hotfix.py
      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm -q .github/hotfix.py .github/workflows/hotfix-cache.yml
          git commit -m "fix: 切换镜像站仓库时清掉旧清单缓存；版本无变化时保留数据库时间戳"
          git push
