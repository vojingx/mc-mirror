name: 更新版本数据库

on:
  schedule:
    # 每天 02:17 UTC（北京时间 10:17）自动同步一次
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      mirror_latest_series:
        description: "镜像最近几个系列的版本详情"
        required: false
        default: "3"
  push:
    paths:
      - "tools/**"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成索引
        run: |
          python tools/update_index.py \
            --mirror-latest-series "${{ github.event.inputs.mirror_latest_series || 3 }}"

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index
          if git diff --staged --quiet; then
            echo "数据库没有变化，跳过提交"
          else
            git commit -m "chore: 更新版本数据库 $(date -u +%Y-%m-%d)"
            git push
          fi
